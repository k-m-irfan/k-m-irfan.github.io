<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohammed Irfan</title>
<meta name="description" content="Research portfolio: multimodal AI, omni-modal video, medical VLMs, speech.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="shared/data.js"></script>
<script src="shared/brand-icons.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { if (localStorage.getItem("studio-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #f0f0ed;
    --border: rgba(0,0,0,.08);
    --border-strong: rgba(0,0,0,.16);
    --text: #121214;
    --muted: #63636b;
    --faint: #9a9aa2;
    --accent: #0e7490;
    --accent-ink: #ffffff;
    --accent-soft: rgba(14,116,144,.10);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 16px 32px -24px rgba(0,0,0,.25);
    --radius: 18px;
    --sans: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --display: var(--sans);
    --display-weight: 700;
    --display-tracking: -.04em;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0b;
    --surface: #111113;
    --surface-2: #17171a;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.16);
    --text: #ededef;
    --muted: #8b8b94;
    --faint: #5c5c64;
    --accent: #22d3ee;
    --accent-ink: #06141a;
    --accent-soft: rgba(34,211,238,.13);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.8);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img, video { display: block; max-width: 100%; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; }

  /* layout: sticky profile panel + content */
  .shell { max-width: 1440px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: 288px minmax(0,1fr); gap: 32px; align-items: start; }
  .content { min-width: 0; }
  .side {
    position: sticky; top: 72px; margin-top: 16px; max-height: calc(100vh - 88px); overflow: hidden;
    padding: clamp(16px, 2.6vh, 24px); display: flex; flex-direction: column; gap: clamp(10px, 2vh, 20px);
  }
  .side::-webkit-scrollbar { display: none; }
  .avatar {
    width: clamp(60px, calc(100vh - var(--side-rest, 572px)), 100%); margin: 0 auto; aspect-ratio: 1; border-radius: 50%; overflow: hidden; display: grid; place-items: center; position: relative; flex: none;
    background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: var(--display-weight); font-size: 38px;
    letter-spacing: var(--display-tracking); border: 1px solid var(--border);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; transform: scale(1.25); transform-origin: 50% 45%; }
  .side h1 { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: calc(var(--display-tracking) * .7); font-size: 28px; line-height: 1.1; margin: clamp(10px, 1.8vh, 18px) 0 6px; }
  .side .role { color: var(--muted); font-size: 14.5px; margin: 0; }
  .facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
  .facts li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; align-items: start; }
  .facts li svg { margin-top: 2px; }
  .facts svg { color: var(--faint); }
  .facts a:hover { color: var(--accent); }
  .socials { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .socials a {
    height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted);
    background: var(--surface-2); border: 1px solid transparent; transition: color .15s, border-color .15s, transform .15s;
  }
  .socials a:hover { color: var(--accent); border-color: var(--border-strong); transform: translateY(-1px); }
  .catch { padding-top: clamp(10px, 1.6vh, 16px); border-top: 1px solid var(--border); display: grid; }
  .catch .label { color: var(--faint); text-transform: uppercase; padding-bottom: 6px; }
  .catch .ev { display: grid; grid-template-columns: minmax(0,1fr) 14px; gap: 2px 8px; padding: 10px 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .catch .ev + .ev { border-top: 1px solid var(--border); }
  .catch .ev .mono { color: var(--accent); font-size: 11.5px; }
  .catch .ev .arrow { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .catch a.ev:hover .arrow { color: var(--accent); transform: translate(2px,-2px); }
  .catch a.ev:hover .t { color: var(--text); }
  .catch .dot { flex: none; }
  .catch .ev b { color: var(--text); font-weight: 600; }
  .catch .ev .t { grid-column: 1; }

  /* nav */
  html { scroll-padding-top: 64px; }
  nav.top {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid var(--border);
  }
  nav.top .wrap { max-width: 1440px; display: flex; align-items: center; gap: 24px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; font-family: var(--mono);
  }
  .navlinks { display: flex; gap: 4px; margin-left: auto; }
  .navlinks a { color: var(--muted); font-size: 14px; padding: 6px 10px; border-radius: 8px; transition: color .15s, background .15s; }
  .navlinks a:hover { color: var(--text); background: var(--surface-2); }
  .navlinks a.on { color: var(--accent); background: var(--accent-soft); }
  .navright { display: flex; gap: 8px; align-items: center; }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--border-strong); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;
    border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid var(--border-strong);
    transition: transform .15s, background .15s, border-color .15s;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { border-color: transparent; filter: brightness(1.05); }

  /* sections */
  section { padding: 72px 0 8px; }
  .sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .sechead h2 { font-family: var(--display); font-size: 30px; font-weight: var(--display-weight); letter-spacing: calc(var(--display-tracking) * .6); margin: 0; }
  .sechead .mono { color: var(--faint); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* bento */
  .bento { margin-top: 28px; display: grid; }
  .tile { padding: 22px; position: relative; overflow: hidden; min-width: 0; }
  .tile .label { color: var(--faint); text-transform: uppercase; }
  .t-hero { display: flex; flex-direction: column; gap: 16px; padding: 32px; }
  .t-hero h2 { font-family: var(--display); font-size: clamp(22px, 2vw, 28px); line-height: 1.25; letter-spacing: -.02em; margin: 14px 0 0; font-weight: 600; max-width: 44ch; }
  .t-hero h2 em { font-style: normal; color: var(--accent); }
  .t-hero p { color: var(--muted); font-size: 16.5px; line-height: 1.65; margin: 0; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
  .t-hero p b { color: var(--text); font-weight: 600; }
  .t-hero .bio p + p { margin-top: .9em; }
  .status { display: inline-flex; flex-wrap: wrap; line-height: 1.6; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; background: var(--surface-2);
  }
  .chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
  .heroactions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* publications */
  .pubgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .pub { display: flex; flex-direction: column; overflow: hidden; transition: transform .2s, border-color .2s; }
  .pub:hover { transform: translateY(-3px); border-color: var(--border-strong); }
  .media { aspect-ratio: 16/9; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .media video, .media img { width: 100%; height: 100%; object-fit: cover; }
  .media.contain video, .media.contain img { object-fit: contain; }
  .media .venue {
    position: absolute; top: 12px; left: 12px; font-family: var(--mono); font-size: 11.5px;
    padding: 5px 10px; border-radius: 999px; background: rgba(10,10,11,.75); color: #ededef;
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px);
  }
  .media .first {
    position: absolute; top: 12px; right: 12px; font-family: var(--mono); font-size: 11px;
    padding: 5px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 500;
  }
  .pubbody { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .pubbody h3 { font-family: var(--display); margin: 0; font-size: 18px; letter-spacing: -.015em; font-weight: 600; line-height: 1.25; }
  .pubbody .full { color: var(--muted); font-size: 14px; margin-top: -4px; }
  .pubbody .auth { color: var(--faint); font-size: 13.5px; }
  .pubbody .auth u { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); }
  .pubbody p { color: var(--muted); margin: 0; font-size: 14.5px; }
  .pubfoot { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .plinks { display: flex; gap: 6px; flex-wrap: wrap; }
  .plinks a {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); transition: border-color .15s, color .15s;
  }
  .plinks a:hover { border-color: var(--accent); color: var(--accent); }
  .ic { width: 14px; height: 14px; flex: none; }
  .ic.lg { width: 18px; height: 18px; }
  .ic.brand { fill: currentColor; }
  .ic.line { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .award b { display: inline-flex; align-items: center; gap: 8px; }

  .sechead.sub { margin: 40px 0 14px; }
  .sechead.sub h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .publist { margin-top: 0; }
  .prow {
    display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 20px; align-items: start;
    padding: 16px 22px; border-top: 1px solid var(--border);
  }
  .prow .y { color: var(--accent); padding-top: 3px; }
  .prow:first-child { border-top: 0; }
  .prow .thumb { aspect-ratio: 16/10; border-radius: 10px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
  .prow .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .prow .thumb.contain img { object-fit: contain; }
  .prow h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .prow .auth { color: var(--faint); font-size: 13px; }
  .prow .auth u { color: var(--text); text-decoration: none; }
  .prow .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }

  /* experience */
  .timeline { padding: 8px 0; }
  .xp { display: grid; grid-template-columns: 180px 24px 1fr; gap: 16px; padding: 22px 24px; }
  .xp + .xp { border-top: 1px solid var(--border); }
  .xp .when { color: var(--muted); padding-top: 3px; }
  .xp .rail { position: relative; display: flex; justify-content: center; }
  .xp .rail::before { content: ""; position: absolute; top: 10px; bottom: -40px; width: 1px; background: var(--border-strong); }
  .xp:last-child .rail::before { display: none; }
  .xp .rail i { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; border: 2px solid var(--accent); background: var(--bg); position: relative; }
  .xp:first-child .rail i { background: var(--accent); }
  .xp h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .xp .sub { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .xp p { margin: 0; color: var(--muted); font-size: 15px; max-width: 70ch; }

  /* news */
  .news { padding: 4px 0; }
  .nrow { display: grid; grid-template-columns: 110px 96px 1fr 20px; gap: 16px; align-items: center; padding: 14px 22px; }
  .nrow + .nrow { border-top: 1px solid var(--border); }
  .nrow .date { color: var(--faint); }
  .nrow .txt { color: var(--muted); font-size: 15px; }
  .nrow .txt b { color: var(--text); font-weight: 500; }
  a.nrow:hover { background: var(--surface-2); }
  a.nrow:hover .arrow { color: var(--accent); transform: translate(2px,-2px); }
  .arrow { color: var(--faint); transition: transform .15s, color .15s; }
  .tag-Upcoming { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
  .news { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

  /* awards & service */
  .three { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
  .cardhead { padding: 16px 22px 12px; color: var(--faint); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .seeall { color: var(--muted); }
  .seeall:hover { color: var(--accent); }
  .svc { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 16px; padding: 16px 22px; align-items: baseline; }
  .svc .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 24px; }
  .svc .items b { display: block; }
  .svc .items a:hover b { color: var(--accent); }
  .svc + .svc { border-top: 1px solid var(--border); }
  .svc .r { color: var(--accent); }
  .svc b { font-weight: 600; }
  .svc .items span { color: var(--muted); font-size: 14.5px; }
  .award { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 16px 22px; }
  .award + .award { border-top: 1px solid var(--border); }
  .award .y { color: var(--accent); padding-top: 2px; }
  .award b { font-weight: 500; }
  .award div div { color: var(--muted); font-size: 14px; }
  .award .pi { color: var(--faint); margin-top: 4px; }

  footer { margin-top: 96px; border-top: 1px solid var(--border); }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; padding: 28px 0 40px; gap: 16px; flex-wrap: wrap; }
  footer .big { font-family: var(--display); font-size: clamp(28px, 4vw, 44px); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); }
  footer .big a { color: var(--accent); }
  .fine { color: var(--faint); }

  @media (max-width: 1280px) {
    .pubgrid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  /* very short desktop screens: drop Upcoming so the panel still fits without scrolling */
  @media (min-width: 1025px) and (max-height: 600px) { .side .catch { display: none; } }
  @media (max-width: 1024px) {
    .navlinks { display: none; }
    .shell { grid-template-columns: minmax(0,1fr); gap: 0; }
    .side { position: static; max-height: none; overflow: visible; margin-top: 20px; display: grid; grid-template-columns: auto minmax(0,1fr); column-gap: 20px; }
    .side > .who { display: contents; }
    .side .avatar { grid-row: span 2; width: 136px; margin: 0; }
    .side h1 { margin-top: 4px; }
    .side .facts, .side .socials, .side .catch { grid-column: 1 / -1; }
    .navright { margin-left: auto; }
  }
  @media (max-width: 720px) {
    .wrap, .shell { padding: 0 16px; }
    .side { padding: 20px; grid-template-columns: minmax(0,1fr); }
    .side .avatar { grid-row: auto; width: min(100%, 260px); margin: 0 auto; font-size: 30px; }
    .side .avatar img { transform: scale(1.1); object-position: 50% 35%; }
    .t-hero { padding: 24px; }
    .pubgrid, .three { grid-template-columns: minmax(0,1fr); }
    .svc { grid-template-columns: minmax(0,1fr); gap: 8px; }
    .svc { grid-template-columns: minmax(0,1fr); gap: 2px; }
    .prow { grid-template-columns: minmax(0,1fr); }
    .xp { grid-template-columns: minmax(0,1fr); gap: 4px; padding: 18px; }
    .xp .rail { display: none; }
    .nrow { grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; padding: 14px 16px; }
    .nrow .txt { grid-column: 1 / -1; }
    .nrow .arrow { display: none; }
    footer .big { font-size: 24px; word-break: break-word; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<nav class="top">
  <div class="wrap">
    <div class="navlinks" id="navlinks"></div>
    <div class="navright">
      <button class="iconbtn themebtn" aria-label="Toggle theme"></button>
      <a class="btn primary cvlink" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>Download CV
      </a>
    </div>
  </div>
</nav>

<div class="shell">
<aside class="card side" id="side"></aside>
<div class="content">

<main id="top">
  <div class="bento" id="bento"></div>

  <section id="news">
    <div class="sechead"><h2>News</h2><span class="mono">Updates &amp; talks</span></div>
    <div class="card news" id="newslist"></div>
  </section>

  <section id="research">
    <div class="sechead"><h2>Research</h2><span class="mono" id="pubcount"></span></div>
    <div class="pubgrid" id="featured"></div>
    <div class="sechead sub"><h3>All publications</h3><span class="mono">* equal contribution</span></div>
    <div class="card publist" id="publist"></div>
  </section>

  <section id="experience">
    <div class="sechead"><h2>Experience</h2><span class="mono">Career &amp; education</span></div>
    <div class="card timeline" id="timeline"></div>
  </section>

  <section id="awards-sec">
    <div class="sechead"><h2>Awards &amp; Recognition</h2><span class="mono">Awards &amp; grants</span></div>
    <div class="card" id="awards"></div>
  </section>


  <section id="service">
    <div class="sechead"><h2>Service &amp; mentoring</h2><span class="mono">Reviewing &amp; mentoring</span></div>
    <div class="card" id="servicelist"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="fine mono" id="footfine"></div>
    <div class="fine mono" id="footplace"></div>
  </div>
</footer>
</div>
</div>

<script>
(() => {
  const P = window.PROFILE;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const arrow = `<svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M8 7h9v9"/></svg>`;
  const ext = (href) => href && /^https?:/.test(href) ? ` target="_blank" rel="noopener"` : "";

  // brand logos in their own colours (brand-icons.js); line icons for everything else
  const ICONS = window.BRAND_ICONS || {}, COLORS = window.BRAND_COLORS || {}, FULL = window.BRAND_SVGS || {};
  const LINE = {
    project: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z",
    paper: "M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7",
    link: "M7 17L17 7M8 7h9v9",
  };
  const HOSTS = [[/github\.com/, "github"], [/huggingface\.co/, "huggingface"], [/arxiv\.org/, "arxiv"], [/linkedin\.com/, "linkedin"],
    [/doi\.org/, "doi"], [/scholar\.google/, "scholar"]];
  const hostKey = (url) => (HOSTS.find(([re]) => re.test(url || "")) || [])[1];
  const ORGS = [[/\bMeta\b/, "meta"], [/NVIDIA/, "nvidia"]];
  const orgKey = (text) => (ORGS.find(([re]) => re.test(text || "")) || [])[1];
  const bicon = (k, cls = "") => FULL[k]
    ? `<svg class="ic brand ${cls}" viewBox="${FULL[k].viewBox}" aria-hidden="true">${FULL[k].body}</svg>`
    : ICONS[k]
    ? `<svg class="ic brand ${cls}" viewBox="0 0 24 24" aria-hidden="true"${COLORS[k] ? ` style="fill:${COLORS[k]}"` : ""}><path d="${ICONS[k]}"/></svg>`
    : `<svg class="ic line ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${LINE[k] || LINE.link}"/></svg>`;

  // theme
  const root = document.documentElement;
  const MOON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
  const SUN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const syncIcon = () => {
    const dark = root.dataset.theme === "dark";
    document.querySelectorAll(".themebtn").forEach((b) => {
      b.innerHTML = dark ? SUN : MOON;
      b.title = dark ? "Switch to light mode" : "Switch to dark mode";
    });
  };
  const toggleTheme = () => {
    const dark = root.dataset.theme !== "dark";
    if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
    try { localStorage.setItem("studio-theme", dark ? "dark" : "light"); } catch (e) {}
    syncIcon();
  };

  document.title = `${P.name} · ${P.role}`;

  // side panel
  const L = P.links;
  const icon = (d) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
  const line = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const PIN = line(`<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>`);
  const CAP = line(`<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>`);
  const DL = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>`;
  const socials = [["Google Scholar", L.scholar, "scholar"], ["GitHub", L.github, "github"],
    ["LinkedIn", L.linkedin, "linkedin"], ["Hugging Face", L.huggingface, "huggingface"]].filter(([, h]) => h);
  const sections = [["news", "News"], ["research", "Research"], ["experience", "Experience"], ["awards-sec", "Awards"], ["service", "Service"]];
  const catchMe = P.news.filter((n) => n.tag === "Upcoming").reverse(); // news is newest first; show soonest first
  $("side").innerHTML = `
    <div class="who">
      <div class="avatar">${P.photo ? `<img src="${esc(P.photo)}" alt="${esc(P.name)}">` : esc(P.initials)}</div>
      <div>
        <h1>${esc(P.name)}</h1>
        <p class="role">${esc(P.role)}</p>
      </div>
    </div>
    <ul class="facts">
      <li>${CAP}<span>${esc(P.affiliationFull || P.affiliation)}</span></li>
      <li>${PIN}<span>${esc(P.location)}</span></li>
    </ul>
    <div class="socials">${socials.map(([t, h, k]) => `<a href="${esc(h)}"${ext(h)} title="${t}" aria-label="${t}">${bicon(k, "lg")}</a>`).join("")}</div>
    ${catchMe.length ? `<div class="catch"><span class="label mono">Upcoming</span>${catchMe.map((n) => {
      const inner = `<span class="mono">${esc(n.date)}</span>${n.link ? arrow : ""}<span class="t">${n.text}</span>`;
      return n.link ? `<a class="ev" href="${esc(n.link)}"${ext(n.link)}>${inner}</a>` : `<div class="ev">${inner}</div>`;
    }).join("")}</div>` : ""}`;
  $("navlinks").innerHTML = sections.map(([id, t]) => `<a href="#${id}" data-sec="${id}">${t}</a>`).join("");
  document.querySelectorAll(".cvlink").forEach((a) => a.href = P.cv);
  document.querySelectorAll(".themebtn").forEach((b) => b.onclick = toggleTheme);
  syncIcon();

  // highlight the section in view
  const navLinks = [...document.querySelectorAll(".navlinks a")];
  const spy = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) navLinks.forEach((a) => a.classList.toggle("on", a.dataset.sec === e.target.id));
    });
  }, { rootMargin: "-30% 0px -60% 0px" });
  sections.forEach(([id]) => $(id) && spy.observe($(id)));

  // bio, with the same emphasised phrases as the main site
  const emphasise = (t) => (P.bioEmphasis || []).reduce((h, e) => h.replace(esc(e), `<b>${esc(e)}</b>`), esc(t));

  // bento
  $("bento").innerHTML = `
    <div class="card tile t-hero">
      <div>
        <span class="status mono"><span class="dot"></span>About</span>
      </div>
      <div class="bio">
      ${P.bio.split(/\n\s*\n/).map((t) => `<p>${emphasise(t)}</p>`).join("")}
      </div>
      <div class="heroactions">
        <a class="btn primary" href="#research">View research</a>
        <a class="btn" href="#news">Latest news</a>
      </div>
    </div>`;

  // publications
  const pubs = P.publications; // data.js is ordered newest first
  const featured = pubs.slice(0, 4);
  $("pubcount").textContent = `${pubs.length} papers`;
  const mediaHTML = (m, alt) => m.type === "video"
    ? `<video data-src="${m.src}" poster="${m.poster || ""}" muted loop playsinline preload="none" aria-label="${esc(alt)}"></video>`
    : `<img src="${m.src}" alt="${esc(alt)}" loading="lazy">`;
  const linksHTML = (links) => Object.entries(links).map(([k, v]) => `<a href="${esc(v)}"${ext(v)}>${bicon(hostKey(v) || k.toLowerCase().split(" ")[0])}${esc(k)}</a>`).join("");
  $("featured").innerHTML = featured.map((p) => `
    <article class="card pub" id="pub-${p.id}">
      <div class="media ${p.media.fit === "contain" ? "contain" : ""}" style="${p.media.bg ? `background:${p.media.bg}` : ""}">
        ${mediaHTML(p.media, p.short)}
        <span class="venue">${esc(p.venue)}</span>
      </div>
      <div class="pubbody">
        <h3>${esc(p.short)}</h3>
        <div class="full">${esc(p.title)}</div>
        <p>${esc(p.summary)}</p>
        <div class="auth">${p.authors}</div>
        <div class="pubfoot">
          <div class="plinks">${linksHTML(p.links)}</div>
        </div>
      </div>
    </article>`).join("");
  $("publist").innerHTML = pubs.map((p, i) => `
    <div class="prow">
      <span class="mono y">${i === 0 || pubs[i - 1].year !== p.year ? p.year : ""}</span>
      <div>
        <h4>${esc(p.title)}</h4>
        <div class="auth">${p.authors}</div>
        <div class="meta"><span class="chip accent">${esc(p.venue)}</span></div>
      </div>
      <div class="plinks">${linksHTML(p.links)}</div>
    </div>`).join("");

  // experience
  $("timeline").innerHTML = P.experience.map((x) => `
    <div class="xp">
      <div class="when mono">${esc(x.when)}</div>
      <div class="rail"><i></i></div>
      <div>
        <h3>${esc(x.org)}</h3>
        <div class="sub">${esc(x.role)} · ${esc(x.place)}</div>
        <p>${esc(x.text)}</p>
      </div>
    </div>`).join("");

  // news: every entry, scrollable after the first six
  const NEWS_SHOWN = 6;
  $("newslist").innerHTML = P.news.map((n) => {
    const inner = `<span class="mono date">${esc(n.date)}</span><span><span class="chip tag-${esc(n.tag)}">${esc(n.tag)}</span></span><span class="txt">${n.text}</span>${n.link ? arrow : "<span></span>"}`;
    return n.link ? `<a class="nrow" href="${esc(n.link)}"${ext(n.link)}>${inner}</a>` : `<div class="nrow">${inner}</div>`;
  }).join("");
  const fitNews = () => {
    const rows = $("newslist").children;
    if (rows.length > NEWS_SHOWN) $("newslist").style.maxHeight = `${rows[NEWS_SHOWN].offsetTop - rows[0].offsetTop + 4}px`;
  };
  fitNews();
  addEventListener("resize", fitNews);
  document.fonts?.ready.then(fitNews);

  // awards
  $("awards").innerHTML = P.awards.map((a) => `
    <div class="award"><span class="mono y">${esc(a.year)}</span><div><b>${orgKey(a.title) ? bicon(orgKey(a.title)) : ""}${a.link ? `<a href="${esc(a.link)}"${ext(a.link)}>${esc(a.title)} ↗</a>` : esc(a.title)}</b><div>${esc(a.note)}</div>${a.pi ? `<div class="pi mono">PI: ${esc(a.pi)}</div>` : ""}</div></div>`).join("");


  // service
  const GROUPS = { Reviewer: "Reviewing", Mentor: "Mentoring" };
  const roles = [...new Set((P.service || []).map((x) => x.role))];
  $("servicelist").innerHTML = roles.map((r) => `
    <div class="svc"><span class="mono r">${esc(GROUPS[r] || r)}</span><div class="items">${P.service.filter((x) => x.role === r).map((x) =>
      `<div>${x.link ? `<a href="${esc(x.link)}"${ext(x.link)}><b>${esc(x.where)} ↗</b></a>` : `<b>${esc(x.where)}</b>`}<span>${esc(x.note)}</span></div>`).join("")}</div></div>`).join("");

  // footer
  $("footplace").textContent = `${P.affiliation} · ${P.location}`;
  $("footfine").textContent = `© ${new Date().getFullYear()} ${P.name}`;

  // play videos only when visible
  const io = new IntersectionObserver((entries) => {
    entries.forEach(({ target: v, isIntersecting }) => {
      if (isIntersecting) {
        if (v.dataset.src && !v.src) v.src = v.dataset.src;
        v.play().catch(() => {});
      } else v.pause();
    });
  }, { threshold: 0.25 });
  document.querySelectorAll("video").forEach((v) => io.observe(v));
})();
</script>
</body>
</html>
